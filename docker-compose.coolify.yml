services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: .
      dockerfile: infra/minio/Dockerfile
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"

  minio-init:
    build:
      context: .
      dockerfile: infra/minio/Dockerfile
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      S3_BUCKET: ${S3_BUCKET:-multiventas}
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "Esperando MinIO..."
          sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set download "local/$$S3_BUCKET"
        echo "Bucket $$S3_BUCKET listo"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:?}
      DIRECT_URL: ${DIRECT_URL:?}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?}
      MP_CLIENT_ID: ${MP_CLIENT_ID:?}
      MP_CLIENT_SECRET: ${MP_CLIENT_SECRET:?}
      MP_REDIRECT_URI: ${MP_REDIRECT_URI:?}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:?}
      MP_WEBHOOK_URL: ${MP_WEBHOOK_URL:?}
      MP_MARKETPLACE_FEE_RATE: ${MP_MARKETPLACE_FEE_RATE:-0.08}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:?}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-multiventas}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?}
    expose:
      - "3001"
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  redis_data:
  minio_data:
