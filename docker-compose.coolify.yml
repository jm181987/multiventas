services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: .
      dockerfile: infra/minio/Dockerfile
    restart: unless-stopped
    command: server /data --address ":80" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio_data:/data
    expose:
      - "80"
      - "9001"
    networks:
      - default

  minio-init:
    build:
      context: .
      dockerfile: infra/minio/Dockerfile
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      S3_BUCKET: ${S3_BUCKET:-multiventas}
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:80 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "Esperando MinIO..."
          sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set download "local/$$S3_BUCKET"
        echo "Bucket $$S3_BUCKET listo"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "80"
      DATABASE_URL: ${DATABASE_URL:?}
      DIRECT_URL: ${DIRECT_URL:?}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?}
      MP_CLIENT_ID: ${MP_CLIENT_ID:?}
      MP_CLIENT_SECRET: ${MP_CLIENT_SECRET:?}
      MP_REDIRECT_URI: https://www.sevende.knjpro.site/api/payments/mercadopago/callback
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:?}
      MP_WEBHOOK_URL: https://www.sevende.knjpro.site/api/webhooks/mercadopago
      MP_MARKETPLACE_FEE_RATE: ${MP_MARKETPLACE_FEE_RATE:-0.08}
      WEB_PUBLIC_URL: https://www.sevende.knjpro.site
      API_PUBLIC_URL: https://www.sevende.knjpro.site
      S3_ENDPOINT: http://minio:80
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-multiventas}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: https://www.sevende.knjpro.site/media
    expose:
      - "80"
    networks:
      - default
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:80/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://www.sevende.knjpro.site/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "80"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: https://www.sevende.knjpro.site/api
      INTERNAL_API_URL: http://api:80/api
      S3_BUCKET: ${S3_BUCKET:-multiventas}
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.services.multiventas-web.loadbalancer.server.port=80"
      - 'traefik.http.routers.multiventas-web-http.rule=Host(`www.sevende.knjpro.site`) || Host(`sevende.knjpro.site`)'
      - "traefik.http.routers.multiventas-web-http.entrypoints=http"
      - "traefik.http.routers.multiventas-web-http.priority=100"
      - "traefik.http.routers.multiventas-web-http.middlewares=multiventas-force-https"
      - "traefik.http.middlewares.multiventas-force-https.redirectscheme.scheme=https"
      - 'traefik.http.routers.multiventas-web-https.rule=Host(`www.sevende.knjpro.site`) || Host(`sevende.knjpro.site`)'
      - "traefik.http.routers.multiventas-web-https.entrypoints=https"
      - "traefik.http.routers.multiventas-web-https.priority=100"
      - "traefik.http.routers.multiventas-web-https.tls=true"
      - "traefik.http.routers.multiventas-web-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.multiventas-web-https.service=multiventas-web"
    networks:
      - default
      - coolify
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  redis_data:
  minio_data:

networks:
  coolify:
    external: true
