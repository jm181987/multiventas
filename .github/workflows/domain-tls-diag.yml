name: Domain TLS Diagnostic

on:
  push:
    branches:
      - diag/www-tls

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe DNS TLS and mixed content
        shell: bash
        run: |
          set +e
          echo "=== STRICT TLS WWW ==="
          curl -vI --max-time 20 https://www.sevende.knjpro.site/ 2>&1
          echo "STRICT_TLS_EXIT=$?"

          echo "=== STRICT TLS HEALTH ==="
          curl -v --max-time 20 https://www.sevende.knjpro.site/api/health/ready 2>&1
          echo "STRICT_HEALTH_EXIT=$?"

          echo "=== PAGE HTML ==="
          curl -fsSL --max-time 20 https://www.sevende.knjpro.site/ -o /tmp/home.html
          echo "HOME_EXIT=$?"

          echo "=== HTTP REFERENCES ==="
          grep -Eo 'http://[^"'"'"' <>) ]+' /tmp/home.html | sort -u || true

          echo "=== HTTPS REFERENCES SAMPLE ==="
          grep -Eo 'https://[^"'"'"' <>) ]+' /tmp/home.html | sort -u | head -50 || true

          echo "=== CERTIFICATE ==="
          echo | openssl s_client -connect www.sevende.knjpro.site:443 -servername www.sevende.knjpro.site 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
