name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_ACCESS_SECRET: ci_access_secret_please_replace_123456
      JWT_REFRESH_SECRET: ci_refresh_secret_please_replace_123456
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      MP_CLIENT_ID: ci
      MP_CLIENT_SECRET: ci
      MP_REDIRECT_URI: ""
      MP_WEBHOOK_SECRET: ci
      MP_WEBHOOK_URL: https://example.com/api/webhooks/mercadopago
      WEB_PUBLIC_URL: https://example.com
      API_PUBLIC_URL: https://api.example.com
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      REDIS_URL: redis://localhost:6379
      S3_REGION: us-east-1
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: ci
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: https://media.example.com
      SEED_ADMIN_PASSWORD: ChangeMeNow123!
      SEED_VENDOR_PASSWORD: ChangeMeNow123!

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Seed integration database
        run: pnpm db:seed

      - name: Public RLS store access
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/rls-store-access.sql <<'SQL'
          DROP ROLE IF EXISTS rls_probe;
          CREATE ROLE rls_probe NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO rls_probe;
          GRANT SELECT ON vendors, stores, products, product_images TO rls_probe;

          BEGIN;
          SET LOCAL ROLE rls_probe;
          SELECT set_config('app.role', 'public', true);
          SELECT set_config('app.public', 'true', true);
          SELECT set_config('app.tenant_id', '', true);
          SELECT set_config('app.user_id', '', true);

          SELECT 1 / CASE WHEN count(*) = 1 THEN 1 ELSE 0 END AS public_store_visible
          FROM stores s
          JOIN vendors v ON v.id = s.tenant_id
          WHERE s.slug = 'tienda-demo-1'
            AND s.status = 'ACTIVE'
            AND s.deleted_at IS NULL
            AND v.status = 'APPROVED'
            AND v.deleted_at IS NULL;
          ROLLBACK;
          SQL

          docker run --rm --network host \
            -e PGPASSWORD=ci \
            -v /tmp/rls-store-access.sql:/tmp/rls-store-access.sql:ro \
            postgres:16-alpine \
            psql -h 127.0.0.1 -U ci -d ci -v ON_ERROR_STOP=1 -f /tmp/rls-store-access.sql

      - name: Functional API integration
        run: bash scripts/ci-functional-smoke.sh

      - name: API Docker smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker build -f apps/api/Dockerfile -t multiventas-api-smoke .
          docker run -d --name multiventas-api-smoke             --network host             -e NODE_ENV=production             -e API_PORT=3001             -e DATABASE_URL="$DATABASE_URL"             -e DIRECT_URL="$DIRECT_URL"             -e REDIS_URL="$REDIS_URL"             -e JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET"             -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET"             -e JWT_ACCESS_TTL=15m             -e JWT_REFRESH_TTL=30d             -e TOKEN_ENCRYPTION_KEY="$TOKEN_ENCRYPTION_KEY"             -e MP_CLIENT_ID="$MP_CLIENT_ID"             -e MP_CLIENT_SECRET="$MP_CLIENT_SECRET"             -e MP_REDIRECT_URI="$MP_REDIRECT_URI"             -e MP_WEBHOOK_SECRET="$MP_WEBHOOK_SECRET"             -e MP_WEBHOOK_URL="$MP_WEBHOOK_URL"             -e MP_MARKETPLACE_FEE_RATE=0.08             -e WEB_PUBLIC_URL="$WEB_PUBLIC_URL"             -e API_PUBLIC_URL="$API_PUBLIC_URL"             -e S3_ENDPOINT="$S3_ENDPOINT"             -e S3_REGION="$S3_REGION"             -e S3_BUCKET="$S3_BUCKET"             -e S3_ACCESS_KEY="$S3_ACCESS_KEY"             -e S3_SECRET_KEY="$S3_SECRET_KEY"             -e S3_FORCE_PATH_STYLE="$S3_FORCE_PATH_STYLE"             -e S3_PUBLIC_URL="$S3_PUBLIC_URL"             multiventas-api-smoke

          cleanup_api() {
            docker logs multiventas-api-smoke || true
            docker rm -f multiventas-api-smoke >/dev/null 2>&1 || true
          }
          trap cleanup_api EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/tmp/docker-health.json; then
              cat /tmp/docker-health.json
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' multiventas-api-smoke)" != "true" ]; then
              echo "API Docker container exited before becoming healthy"
              docker logs multiventas-api-smoke
              exit 1
            fi
            sleep 1
          done

          echo "API Docker container did not become healthy within 30 seconds"
          docker logs multiventas-api-smoke
          exit 1

      - name: Web Docker smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker build             --build-arg NEXT_PUBLIC_API_URL=http://127.0.0.1:3001/api             -f apps/web/Dockerfile             -t multiventas-web-smoke .

          docker run -d --name multiventas-web-smoke             -p 8080:80             -e NODE_ENV=production             -e PORT=80             -e HOSTNAME=0.0.0.0             -e NEXT_PUBLIC_API_URL=http://127.0.0.1:3001/api             multiventas-web-smoke

          cleanup_web() {
            docker logs multiventas-web-smoke || true
            docker rm -f multiventas-web-smoke >/dev/null 2>&1 || true
          }
          trap cleanup_web EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ >/tmp/web-home.html; then
              grep -q "Multiventas" /tmp/web-home.html
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' multiventas-web-smoke)" != "true" ]; then
              echo "Web Docker container exited before becoming healthy"
              docker logs multiventas-web-smoke
              exit 1
            fi
            sleep 1
          done

          echo "Web Docker container did not become healthy within 30 seconds"
          docker logs multiventas-web-smoke
          exit 1

